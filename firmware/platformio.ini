; Mobile robot firmware
;
; One project, three programs. Pick which one to build with the env
; switcher in the VS Code status bar (bottom left), or:
;
;   pio run -e motortest -t upload    lesson 4: motors only, no network
;   pio run -e microros  -t upload    lesson 5: a real ROS 2 node
;   pio run -e mqtt      -t upload    appendix: MQTT instead of ROS 2

[platformio]
default_envs = motortest
src_dir = src
include_dir = include

[env]
; Pinned on purpose. Every computer must get the same toolchain,
; otherwise "it works on mine" eats an afternoon.
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall

; ---------------------------------------------------------------
; Lesson 4 -- does the hardware work? (no network at all)
; ---------------------------------------------------------------
[env:motortest]
build_src_filter = +<motortest/>

; ---------------------------------------------------------------
; Appendix -- the robot speaks MQTT instead of ROS 2.
; Not part of the main lessons. Keep it as a fallback: if micro-ROS
; will not cooperate on the day, this path still moves the robot.
; ---------------------------------------------------------------
[env:mqtt]
build_src_filter = +<mqtt/>
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4

; ---------------------------------------------------------------
; Lesson 5 -- the ESP32 becomes a real ROS 2 node
; This is the one students spend most of their time on.
; ---------------------------------------------------------------
[env:microros]
build_src_filter = +<microros/>
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
; ---------------------------------------------------------------
;  MUST match the ROS 2 on your computer.
;
;    Ubuntu 24.04  ->  jazzy
;    Ubuntu 22.04  ->  humble
;
;  Not optional: the library defaults to a different distro, and a
;  mismatched node connects to the agent and then never appears in
;  `ros2 node list` -- the most confusing failure in this project.
;
;  If you change it, delete firmware/.pio first. The distro is baked
;  in at build time and a stale build will not notice.
;
;  scripts/check_setup.sh checks this line against your computer.
; ---------------------------------------------------------------
board_microros_distro = jazzy
board_microros_transport = wifi
