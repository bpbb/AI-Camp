; Firmware หุ่นยนต์เคลื่อนที่
;
; หนึ่งโปรเจกต์ สองโปรแกรม เลือก env ที่จะ build จาก status bar
; ของ VS Code (มุมซ้ายล่าง) หรือใช้คำสั่ง:
;
;   ./scripts/build_firmware.sh motortest upload    บทที่ 4: มอเตอร์อย่างเดียว
;   ./scripts/build_firmware.sh microros upload     บทที่ 5-7: ROS 2 node

[platformio]
default_envs = motortest
src_dir = src
include_dir = include

[env]
; ล็อกเวอร์ชันไว้ เพื่อให้ทุกเครื่องใช้ toolchain เดียวกัน
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall

; ---------------------------------------------------------------
; บทที่ 4 -- ทดสอบ hardware (ไม่ใช้เครือข่าย)
; ---------------------------------------------------------------
[env:motortest]
build_src_filter = +<motortest/>

; ---------------------------------------------------------------
; บทที่ 5 -- ESP32 กลายเป็น ROS 2 node จริง
; ---------------------------------------------------------------
[env:microros]
build_src_filter = +<microros/>
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
; ---------------------------------------------------------------
;  ต้องตรงกับ ROS 2 บนคอมพิวเตอร์
;
;    Ubuntu 24.04  ->  jazzy
;    Ubuntu 22.04  ->  humble
;
;  ถ้า distro ไม่ตรง node จะต่อ agent ได้แต่ไม่ปรากฏใน `ros2 node list`
;
;  ถ้าเปลี่ยนค่า ให้ลบ firmware/.pio ก่อน เพราะ distro ถูกฝังตอน build
;
;  scripts/check_setup.sh ตรวจบรรทัดนี้เทียบกับคอมพิวเตอร์ให้
; ---------------------------------------------------------------
board_microros_distro = jazzy
board_microros_transport = wifi
